[project]
name = "fipezap-sqlite"
version = "0.1.0"
description = "FIPE ZAP historical series XLSX to SQLite"
dependencies = [
    "loguru>=0.7",
    "openpyxl>=3.1",
    "typer>=0.12",
]

[project.scripts]
fipezap-sqlite = "fipezap_sqlite.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PL",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
